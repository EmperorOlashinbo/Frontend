<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - My Dynamic Website</title>
    <link rel="stylesheet" href="seminar_2.css">
    <script src="main.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <header>
        <img src="postify_logo_no_bg_1.png" alt="Postify Logo" width="80" height="100">
        <nav>
            <ul>
                <li><a href="home.html">Home</a></li>
                <li><a href="posts.html">Posts</a></li>
                <li><a href="contact.html">Contact</a></li>
                <li><a href="about.html">About</a></li>
            </ul>
        </nav>
        <div id="search-bar">
                <input type="text" placeholder="Search...">
                <button type="button">Search posts</button>
            </div>
    </header>
    <main>
        <section id="contact">
            <h1>Contact Us</h1>
            <form id="contact-form">
                <div class="form-group">
                    <label for="name">Name:</label>
                    <input type="text" id="name" name="name" required placeholder="Your Name">
                    <span class="error-message" id="name-error"></span>
                </div>
                <div class="form-group">
                    <label for="email">Email:</label>
                    <input type="email" id="email" name="email" required placeholder="Your Email">
                    <span class="error-message" id="email-error"></span>
                </div>
                <div class="form-group">
                    <label for="message">Message:</label>
                    <textarea name="message" id="message" rows="5" required placeholder="Your Message"></textarea>
                    <span class="error-message" id="message-error"></span>
                </div>
                <div class="form-group">
                    <input type="checkbox" id="confirm" name="confirm">
                    <label for="confirm">Confirm to send</label>
                    <span class="error-message" id="confirm-error"></span>
                </div>
                <button type="submit" id="send-button" disabled>Send</button>
            </form>
        </section>
    </main>
    <footer class="footer">
        <p>&copy; 2025 Postify. All rights reserved.</p>
        <p><a href="privacy.html">Privacy Policy</a> | <a href="terms.html">Terms of Service</a></p>
        <p><a href="contact.html">Contact Us</a></p>
        <p>Follow us on <a href="https://twitter.com/postify" target="_blank">Twitter</a> | <a href="https://facebook.com/postify" target="_blank">Facebook</a></p>
        <p>Subscribe to our newsletter for updates!</p>
        <form id="newsletter-form" action="#" method="post">
            <input type="email" placeholder="Enter your email" required>
            <button type="submit">Subscribe</button>
        </form>
        <p id="subscription-message" style="display: none;"></p>
        <a href="#top" class="back-to-top"><i class="fa fa-arrow-up"></i></a>
    </footer>    
</body>
</html>
